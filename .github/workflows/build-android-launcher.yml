name: Build Android launcher

on:
  push:
    paths:
      - "android-launcher/**"
      - ".github/workflows/build-android-launcher.yml"
  pull_request:
    paths:
      - "android-launcher/**"
      - ".github/workflows/build-android-launcher.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: platform-tools
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Copy APK into repository
        run: |
          mkdir -p ../appbuild
          cp app/build/outputs/apk/debug/app-debug.apk ../appbuild/launcher.apk
      - name: Commit APK to appbuild
        run: |
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. add appbuild/launcher.apk
          if ! git -C .. diff --cached --quiet; then
            git -C .. commit -m "Add latest Android launcher APK"
            git -C .. push
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-launcher-debug
          path: appbuild/launcher.apk
          if-no-files-found: error
